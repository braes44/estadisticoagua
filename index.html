<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Calidad - Puntos de Muestreo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    th { background-color: #f2f2f2; }
    input, select { margin-bottom: 10px; padding: 5px; width: 100%; }
    .container { max-width: 800px; margin: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ingreso de Puntos de Muestreo</h2>
    <form id="muestreo-form">
      <label for="usuario">Nombre del Usuario:</label>
      <input type="text" id="usuario" required>

      <label for="tipoAgua">Tipo de Agua:</label>
      <select id="tipoAgua" required>
        <option value="Purificada">Purificada</option>
        <option value="Potable">Potable</option>
        <option value="Estéril">Estéril</option>
      </select>

      <label for="codigo">Código del Punto:</label>
      <input type="text" id="codigo" required>

      <label for="descripcion">Descripción:</label>
      <input type="text" id="descripcion" required>

      <label for="ubicacion">Ubicación Física:</label>
      <input type="text" id="ubicacion" required>

      <label for="frecuencia">Frecuencia Recomendada:</label>
      <input type="text" id="frecuencia" required>

      <label for="observaciones">Observaciones:</label>
      <input type="text" id="observaciones">

      <button type="submit">Guardar Punto</button>
    </form>

    <h3>Listado de Puntos de Muestreo</h3>
    <button onclick="exportCSV()">Exportar CSV</button>
    <input type="file" id="importFile" accept=".csv" onchange="importCSV(event)">
    <table id="tablaPuntos">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Tipo Agua</th>
          <th>Código</th>
          <th>Descripción</th>
          <th>Ubicación</th>
          <th>Frecuencia</th>
          <th>Observaciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
