<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Calidad de Agua</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    table { width: 100%; margin-top: 20px; }
    canvas { max-width: 100%; height: auto; }
  </style>
</head>
<body>

  <h1>Control de Calidad de Agua</h1>

  <form id="dataForm">
    <label>Fecha: <input type="date" id="fecha" required></label>
    <label>Resultado: <input type="number" id="resultado" step="any" required></label>
    <label>Muestreador: <input type="text" id="muestreador"></label>
    <label>Observaciones: <input type="text" id="observaciones"></label>
    <button type="submit">Agregar</button>
  </form>

  <canvas id="grafico"></canvas>

  <table id="tablaDatos">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Resultado</th>
        <th>Muestreador</th>
        <th>Observaciones</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <button id="exportarCSV">Exportar CSV</button>

  <script>
    const datos = [];
    const limites = { superior: 100, inferior: 0 }; // Ajusta según USP

    const ctx = document.getElementById('grafico').getContext('2d');
    const grafico = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Resultado',
            data: [],
            borderColor: 'blue',
            fill: false
          },
          {
            label: 'Límite Superior',
            data: [],
            borderColor: 'red',
            borderDash: [5,5],
            fill: false
          },
          {
            label: 'Límite Inferior',
            data: [],
            borderColor: 'green',
            borderDash: [5,5],
            fill: false
          }
        ]
      },
      options: {
        scales: {
          x: { title: { display: true, text: 'Fecha' } },
          y: { title: { display: true, text: 'Valor' } }
        }
      }
    });

    document.getElementById('dataForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const fecha = document.getElementById('fecha').value;
      const resultado = parseFloat(document.getElementById('resultado').value);
      const muestreador = document.getElementById('muestreador').value;
      const observaciones = document.getElementById('observaciones').value;

      datos.push({ fecha, resultado, muestreador, observaciones });

      // Actualizar tabla
      const fila = document.createElement('tr');
      fila.innerHTML = `<td>${fecha}</td><td>${resultado}</td><td>${muestreador}</td><td>${observaciones}</td>`;
      document.querySelector('#tablaDatos tbody').appendChild(fila);

      // Actualizar gráfico
      grafico.data.labels.push(fecha);
      grafico.data.datasets[0].data.push(resultado);
      grafico.data.datasets[1].data.push(limites.superior);
      grafico.data.datasets[2].data.push(limites.inferior);
      grafico.update();

      // Limpiar formulario
      document.getElementById('dataForm').reset();
    });

    document.getElementById('exportarCSV').addEventListener('click', function() {
      let csv = 'Fecha,Resultado,Muestreador,Observaciones\n';
      datos.forEach(row => {
        csv += `${row.fecha},${row.resultado},${row.muestreador},${row.observaciones}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.setAttribute('href', url);
      enlace.setAttribute('download', 'datos_agua.csv');
      enlace.style.display = 'none';
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
    });
  </script>

</body>
</html>
